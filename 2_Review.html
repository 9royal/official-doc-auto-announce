<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --ink:#1f2328; --muted:#6b7280;
    --accent:#1a5fb4; --red:#c0392b; --redbg:#fdecea; --yellow:#b26a00; --yellowbg:#fff6e5;
    --green:#1e7a46; --greenbg:#e8f5ec;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       background:var(--bg);color:var(--ink)}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;
         display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  header .brand{height:34px;width:auto;flex:none;display:block}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{color:var(--muted);font-size:13px}
  .wrap{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;align-items:start}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .list{overflow:hidden}
  .list h2{font-size:13px;color:var(--muted);margin:0;padding:12px 14px 6px;letter-spacing:.04em}
  .item{padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
  .item:hover{background:#f0f4f9}
  .item.active{background:#e8f0fb;box-shadow:inset 3px 0 0 var(--accent)}
  .item .t{font-weight:600;font-size:14px;margin-bottom:3px}
  .item .m{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}

  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:5px}
  .dot.紅{background:var(--red)} .dot.黃{background:var(--yellow)} .dot.綠{background:var(--green)}

  .pane{padding:18px 20px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:1100px){.row{grid-template-columns:1fr}}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 4px;font-weight:600}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
    border-radius:6px;font:inherit;background:#fff}
  textarea{min-height:200px;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:13px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  .meta{background:#f8f9fb;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px}
  .meta div{display:flex;gap:8px;padding:3px 0}
  .meta b{color:var(--muted);font-weight:600;min-width:72px}

  .risk{border-radius:8px;padding:12px 14px;margin:14px 0;font-size:13px}
  .risk.紅{background:var(--redbg);border:1px solid #f3c0ba;color:var(--red)}
  .risk.黃{background:var(--yellowbg);border:1px solid #f0d9a8;color:var(--yellow)}
  .risk.綠{background:var(--greenbg);border:1px solid #bfe0cb;color:var(--green)}
  .risk ul{margin:6px 0 0;padding-left:18px}
  .risk .h{font-weight:700}

  .att{font-size:13px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
  .att div{padding:8px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .att div:first-child{border-top:none}
  .att a{color:var(--accent);text-decoration:none}

  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  button{padding:9px 18px;border-radius:7px;border:1px solid var(--line);background:#fff;
         font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:#f0f4f9}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08)}
  button.danger{color:var(--red);border-color:#f3c0ba}
  button:disabled{opacity:.45;cursor:not-allowed}

  iframe{width:100%;height:460px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2328;color:#fff;
    padding:11px 20px;border-radius:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;transition:opacity .25s;max-width:80vw}
  .toast.show{opacity:1}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #fff6;border-top-color:#fff;
    border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}

  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:none;border-radius:0;padding:11px 8px;font-size:14px;color:var(--muted);background:#fff}
  .tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);background:#fff}
  .filters{display:grid;gap:8px;padding:10px 14px}
  .filters select,.filters input{font-size:14px}
  .helper{font-size:13px;font-weight:600}
  .helper.green{color:var(--green)} .helper.yellow{color:var(--yellow)} .helper.red{color:var(--red)} .helper.muted{color:var(--muted)}
  .spacer{flex:1}

  /* v10 發布方式與寄信 */
  .modes{display:flex;gap:8px;flex-wrap:wrap}
  .modes label{display:flex;align-items:center;gap:6px;margin:0;padding:7px 12px;border:1px solid var(--line);
    border-radius:7px;font-size:14px;color:var(--ink);font-weight:600;cursor:pointer;background:#fff}
  .modes label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#eef4fc}
  .modes label:has(input:disabled){opacity:.45;cursor:not-allowed}
  .modes input{width:auto;margin:0}
  .mailrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mailrow #m_desc{grid-column:1 / -1}
  .subj{margin-top:8px;padding:8px 12px;border-radius:6px;background:#f8f9fb;border:1px dashed var(--line);
    font-weight:700;font-size:14px;word-break:break-all}
  .npwarn{margin:8px 0 4px;padding:10px 12px;border:1px solid var(--yellow);border-radius:10px}
  .npwarn p{margin:0 0 6px;color:var(--yellow);font-weight:600}
  .npwarn label{display:flex;gap:8px;align-items:center;margin:0;font-weight:600;color:var(--ink)}
  .npwarn input{width:auto;flex:none;margin:0}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
  .groups label{display:flex;gap:6px;align-items:flex-start;margin:0;padding:6px 8px;border:1px solid var(--line);
    border-radius:6px;font-size:13px;color:var(--ink);font-weight:600;cursor:pointer}
  .groups label small{display:block;font-weight:400;color:var(--muted);font-size:11px;word-break:break-all}
  .groups input{width:auto;margin-top:3px}
  .grphead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
  .grphead label{margin:0}
  .grphead button{padding:4px 10px;font-size:13px}
  #m_count{font-weight:600}
  #m_count.over{color:var(--red)}
  .gm{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8f9fb}
  .gm .row{display:grid;grid-template-columns:minmax(110px,1fr) 2fr auto;gap:6px;align-items:start;margin-bottom:6px}
  .gm .row input,.gm .row textarea{font-size:13px;min-height:0}
  .gm .row textarea{min-height:38px;font-family:inherit}
  .gm .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  @media (max-width:560px){ .gm .row{grid-template-columns:1fr} }
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0}
  .mailstate{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600}
  .mailstate.ok{background:var(--greenbg);color:var(--green)}
  .mailstate.wait{background:#eef4fc;color:var(--accent)}
  .mailstate.bad{background:var(--redbg);color:var(--red)}
  .section{margin-top:18px;padding-top:4px;border-top:1px dashed var(--line)}
  .section h3{font-size:14px;margin:10px 0 0}
</style>
</head>

  <h1>公文自動公告 · 審核台</h1>
  <span class="sub" id="hint">載入中…</span>
  <span class="helper muted" id="helper" aria-live="polite"></span>
  <span class="helper muted" id="mailHelper" aria-live="polite"></span>
  <span style="flex:1"></span>
  <button onclick="load()">重新整理</button>
</header>

<div class="wrap">
  <div class="card list" id="list"></div>
  <div class="card" id="pane"><div class="empty">左邊選一個案件開始審核</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
let CUR = null, DATA = null, DRAFT = null, CURCASE = null;
let TAB = 'pending', FOLDER = '', QUERY = '';   // 清單分頁：待處理／歷史公文（依歸檔資料夾）
// 哪些狀態可以編輯／重新解析、可以退回（送出中不能退回：公告可能已經上了校網）
const EDITABLE = {REVIEW:1, BLOCKED:1, ERROR:1, PARSING:1, NEW:1};
const REJECTABLE = {REVIEW:1, BLOCKED:1, ERROR:1, PARSING:1, NEW:1, APPROVED:1};
// 已核准之後的狀態說明（v10 加上寄信）
const DONE_TEXT = {APPROVED:'已核准 — 等待公告助手自動發布', PUBLISHED:'已發布',
                   MAILING:'已核准 — 等寄信小幫手寄出（約 5 分鐘）', MAILED:'已寄信'};
let GROUPS_TOUCHED = false;   // 收件群組手動改過就不再跟著適用對象自動勾

function toast(m, ms){ const t=document.getElementById('toast'); t.textContent=m;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), ms||3000); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function load(){
  google.script.run.withSuccessHandler(render).withFailureHandler(e=>toast(e.message)).api_list();
}

function render(d){
  DATA = d;
  const n = d.pending.filter(x=>x.status==='REVIEW').length;
  const b = d.pending.filter(x=>x.status==='BLOCKED').length;
  document.getElementById('hint').textContent = n+' 件待審　'+b+' 件已擋下';
  helperBadge(d.helper);
  mailHelperBadge(d.mailHelper);

  const arch = d.archive || [];
  const tab = (key, text) => '<button role="tab" aria-selected="'+(TAB===key)+'" onclick="setTab(\''+key+'\')">'+text+'</button>';
  let h = '<div class="tabs" role="tablist">' + tab('pending', '待處理（'+d.pending.length+'）')
        + tab('archive', '歷史公文（'+arch.length+'）') + '</div>';
  if(TAB === 'pending'){
    h += '<h2>待處理</h2>';
    h += d.pending.length ? d.pending.map(item).join('') : '<div class="empty" style="padding:24px">沒有待處理案件</div>';
    h += '<h2 style="margin-top:10px">最近完成（'+(d.recentHours||48)+' 小時內）</h2>';
    h += d.done.length ? d.done.map(item).join('')
       : '<div class="empty" style="padding:16px">沒有；更早的在「歷史公文」</div>';
  } else {
    const counts = {};
    arch.forEach(x => { counts[x.archive] = (counts[x.archive]||0) + 1; });
    if(FOLDER && !counts[FOLDER]) FOLDER = '';   // 選的資料夾已經沒有公文（例如剛改到別的資料夾）：回到全部
    h += '<div class="filters"><select aria-label="歸檔資料夾" onchange="FOLDER=this.value;renderArchive()">'
      + '<option value="">全部資料夾（'+arch.length+'）</option>'
      + (d.folders||[]).filter(f => counts[f]).map(f =>
          '<option value="'+esc(f)+'"'+(f===FOLDER?' selected':'')+'>'+esc(f)+'（'+counts[f]+'）</option>').join('')
      + '</select><input type="search" aria-label="搜尋標題" placeholder="搜尋標題或機關" value="'+esc(QUERY)+'" oninput="QUERY=this.value;renderArchive()"></div>'
      + '<div id="archBody"></div>';
  }
  document.getElementById('list').innerHTML = h;
  if(TAB === 'archive') renderArchive();
}

function setTab(t){ TAB = t; render(DATA); }

/** 歷史公文：依歸檔資料夾分組，可篩資料夾、搜尋標題或機關 */
function renderArchive(){
  const q = QUERY.trim();
  const arch = (DATA.archive||[]).filter(x => (!FOLDER || x.archive===FOLDER)
    && (!q || (x.title+' '+(x.org||'')).indexOf(q) >= 0));
  let h = '';
  (DATA.folders||[]).forEach(f => {
    const xs = arch.filter(x => x.archive===f);
    if(xs.length) h += '<h2>'+esc(f)+'（'+xs.length+'）</h2>' + xs.map(item).join('');
  });
  document.getElementById('archBody').innerHTML = h || '<div class="empty" style="padding:24px">沒有符合的公文</div>';
}

/** 公告助手狀態（每一輪自動發布都會回報） */
function helperBadge(h){
  const el = document.getElementById('helper');
  if(!h){ el.textContent=''; return; }
  let t, cls;
  if(h.state==='never'){ t='公告助手：還沒有回報（請安裝 1.7 版並開著後台分頁）'; cls='muted'; }
  else if(h.ageMin > 15){ t='公告助手：'+h.ageMin+' 分鐘沒有回報（電腦、Chrome 或後台分頁可能沒開）'; cls='red'; }
  else if(h.state==='paused'){ t='公告助手：已暫停 — '+h.msg; cls='red'; }
  else if(h.state==='login'){ t='公告助手：校網後台登入已過期，請重新登入'; cls='red'; }
  else if(!h.auto || h.state==='off'){ t='公告助手：「核准後自動發布」沒有勾選'; cls='yellow'; }
  else if(h.state==='stuck'){ t='公告助手：在跑，但沒辦法送出 — '+h.msg; cls='yellow'; }
  else { t='公告助手：運作中（'+h.at+'）'; cls='green'; }
  el.textContent = t;
  el.className = 'helper ' + cls;
}

/** 寄信小幫手狀態（裝在寄件帳號，每 5 分鐘回報一次） */
function mailHelperBadge(h){
  const el = document.getElementById('mailHelper');
  if(!h){ el.textContent=''; return; }
  let t, cls;
  if(h.state==='unset'){ t='寄信：還沒設定（在 Apps Script 執行 setupMail）'; cls='muted'; }
  else if(h.state==='never'){ t='寄信小幫手：還沒有回報（請在寄件帳號裝好並執行 setup）'; cls='yellow'; }
  else if(h.state==='error'){ t='寄信小幫手：讀不到寄信佇列 — '+h.msg; cls='red'; }
  else if(h.state==='stale'){ t='寄信小幫手：'+h.ageMin+' 分鐘沒有回報（排程可能停了）'; cls='red'; }
  else if(h.wrongAccount){ t='寄信小幫手：裝在 '+h.account+'，不是指定的寄件帳號'; cls='yellow'; }
  else if(h.state==='warn'){ t='寄信小幫手：暫停寄信 — '+h.msg; cls='red'; }
  else { t='寄信小幫手：運作中（'+h.at+'）'; cls='green'; }
  el.textContent = t;
  el.className = 'helper ' + cls;
}

function item(x){
  let tag = {NEW:'新收件', REVIEW:'待審', BLOCKED:'已擋下', PARSING:'解析中', ERROR:'錯誤',
               APPROVED:'待發布', SUBMITTING:'送出中', PUBLISHED:'已發布', REJECTED:'已退回',
               MAILING:'待寄信', MAILED:'已寄信'}[x.status] || x.status;
  if(x.status==='PUBLISHED' && x.mail==='已寄') tag = '已發布・已寄信';
  if(x.status==='PUBLISHED' && (x.mail==='等公告' || x.mail==='待寄')) tag = '已發布・寄信中';
  const mailBad = x.mail==='失敗' && x.status!=='REJECTED';
  if(mailBad) tag = '寄信失敗';
  // 送出中超過 30 分鐘還沒確認上架、寄信失敗：紅字提醒
  const tagHtml = mailBad ? '<span style="color:var(--red);font-weight:700">'+tag+'</span>'
    : x.stale ? '<span style="color:var(--red);font-weight:700">'+tag+'・請確認</span>' : '<span>'+tag+'</span>';
  return '<div class="item'+(CUR===x.caseId?' active':'')+'" onclick="open_(\''+x.caseId+'\')">'
    + '<div class="t"><span class="dot '+(x.risk||'綠')+'"></span>'+esc(x.title)+'</div>'
    + '<div class="m">'+tagHtml+'<span>'+esc(x.category||'')+'</span><span>'+esc(x.created)+'</span></div>'
    + '</div>';
}

function open_(id){
  CUR = id;
  render(DATA);

  google.script.run.withSuccessHandler(detail).withFailureHandler(e=>toast(e.message)).api_detail(id);
}

const val = id => document.getElementById(id).value;

function payload(){
  return {
    title: val('f_title'),
    body: val('f_body'),
    category: val('f_cat'),
    scope: val('f_scope'),
    startDate: val('f_start'),
    endDate: val('f_end'),
    // v10 發布方式與寄信
    mode: curMode(),
    mailUnit: val('m_unit'),
    mailType: val('m_type'),
    mailDesc: val('m_desc'),
    mailText: val('m_text'),
    mailGroups: Array.from(document.querySelectorAll('#m_groups input:checked')).map(x => x.value),
    notPublicOk: !!(document.getElementById('np_ok') && document.getElementById('np_ok').checked)
  };
}

/** AI 研判不宜公開的原因（風險說明裡那一則） */
function npWhy(c){
  const n = (c.riskNotes || []).find(x => x.indexOf('不宜公開到校網：') === 0);
  return n ? n.slice('不宜公開到校網：'.length).replace(/（[^（）]*寄[^（）]*）$/, '') : '';
}

/** 勾／取消「我已確認可以公開到校網」：解除或恢復公告選項 */
function npChanged(){
  const ok = document.getElementById('np_ok').checked;
  document.querySelectorAll('input[name="mode"]').forEach(x => { if(x.value !== '只有寄信') x.disabled = !ok; });
  if(!ok && curMode() !== '只有寄信'){
    document.querySelector('input[name="mode"][value="只有寄信"]').checked = true;
    modeChanged();
  }
}

/** 目前選的發布方式 */
function curMode(){
  const r = document.querySelector('input[name="mode"]:checked');
  return r ? r.value : '只有公告';
}
function modeLabel(m){
  return ({'公告＋寄信':'核准，發布並寄信', '只有公告':'核准，送交發布', '只有寄信':'核准，寄信'})[m] || '核准，送交發布';
}

/** 換發布方式：只顯示會用到的區塊，核准按鈕跟著改字 */
function modeChanged(){
  const m = curMode();
  document.getElementById('secPost').style.display = m==='只有寄信' ? 'none' : '';
  document.getElementById('secMail').style.display = m==='只有公告' ? 'none' : '';
  const b = document.getElementById('btnOk');
  if(b && !b.disabled) b.textContent = modeLabel(m);
}

/** 換適用對象：收件群組還沒手動改過，就換成這個對象預設的群組 */
function scopeChanged(){
  const c = CURCASE || {};
  if(GROUPS_TOUCHED || !c.scopeGroups) return;
  const want = c.scopeGroups[val('f_scope')] || [];
  document.querySelectorAll('#m_groups input').forEach(x => { x.checked = want.indexOf(x.value) >= 0; });
  countRecipients();
}

/** 寄件標題即時預覽：教-[測驗評量]-九年級第一次模擬考日程表及範圍 */
function mailPreview(){
  const el = document.getElementById('m_preview');
  if(!el) return;
  const d = val('m_desc').trim();
  el.textContent = val('m_unit') + '-[' + val('m_type') + ']-' + (d || '（請填內容簡要說明）');
}

/** 已核准之後的寄信狀態 */
function mailStateHtml(c){
  if(!c.mailState) return '';
  if(c.mailState==='等公告') return '<div class="mailstate wait">寄信：等校網公告上架後自動寄出</div>';
  if(c.mailState==='待寄') return '<div class="mailstate wait">寄信：已排進寄信佇列，寄信小幫手約 5 分鐘內寄出</div>';
  if(c.mailState==='已寄') return '<div class="mailstate ok">寄信：已寄出'+(c.mailAt?'（'+esc(c.mailAt)+'）':'')+'</div>';
  if(c.mailState==='失敗') return '<div class="mailstate bad">寄信失敗：'+esc(c.mailResult||'未說明')
    + '<br>可以先修改上面的寄信內容或收件群組，再按「重新寄送」；不寄了按「不寄了」。</div>';
  if(c.mailState==='取消') return '<div class="mailstate wait" style="color:var(--muted)">寄信：已取消（'+esc(c.mailResult||'')+'）</div>';
  return '';
}

function groupNames(p){
  const g = (CURCASE && CURCASE.groups) || [];
  return p.mailGroups.map(id => (g.find(x => x.id===id) || {name:id}).name).join('、');
}

/** 收件群組的勾選框：值是群組 ID；一個信箱的直接顯示，多個信箱的顯示前兩個和總數 */
function groupBoxes(groups, checked){
  return (groups||[]).map(g => {
    const em = g.emails || [];
    const sub = em.length===1 ? em[0] : em.slice(0,2).join('、') + (em.length>2 ? ' 等 '+em.length+' 個信箱' : '');
    return `<label title="${esc(em.join('\n'))}"><input type="checkbox" value="${esc(g.id)}" ${(checked||[]).indexOf(g.id)>=0?'checked':''}
      onchange="groupsTouched()"><span>${esc(g.name)}<small>${esc(sub)}</small></span></label>`;
  }).join('');
}
function groupsTouched(){ GROUPS_TOUCHED = true; countRecipients(); }

/** 勾選的群組加起來有幾個信箱（重複的只算一次） */
function countRecipients(){
  const el = document.getElementById('m_count');
  if(!el) return 0;
  const g = (CURCASE && CURCASE.groups) || [];
  const set = new Set();
  document.querySelectorAll('#m_groups input:checked').forEach(x => {
    const grp = g.find(y => y.id===x.value);
    (grp ? grp.emails : []).forEach(e => set.add(e));
  });
  el.textContent = set.size;
  el.classList.toggle('over', set.size > ((CURCASE && CURCASE.mailMaxRecipients) || 50));
  return set.size;
}

/** 管理群組：新增、改名、改信箱、刪除；一個群組可以放多個信箱（用逗號、空白或換行分開） */
function gmOpen(){
  const box = document.getElementById('gm');
  const groups = (CURCASE && CURCASE.groups) || [];
  const dom = (CURCASE && CURCASE.mailDomain) || '學校網域';
  box.innerHTML = '<p class="hint" style="margin:0 0 8px">只能填 @' + esc(dom) + ' 的信箱；一個群組可以放多個信箱（用逗號、空白或換行分開，最多 50 個）。'
    + '刪掉的群組，還沒排進寄信佇列的信會寄不出去，要重新勾選。</p>'
    + '<div id="gm_rows">' + groups.map(gmRow).join('') + '</div>'
    + '<div class="acts"><button type="button" onclick="gmAdd()">＋ 新增群組</button>'
    + '<button type="button" class="primary" id="gm_save" onclick="gmSave()">儲存群組</button>'
    + '<button type="button" onclick="gmClose()">取消</button></div>';
  box.hidden = false;
}
function gmRow(g){
  return `<div class="row" data-id="${esc(g.id||'')}">
    <input class="gm-name" aria-label="群組名稱" maxlength="30" placeholder="群組名稱" value="${esc(g.name||'')}">
    <textarea class="gm-emails" aria-label="信箱" rows="2" placeholder="someone@${esc((CURCASE && CURCASE.mailDomain) || 'school.edu.tw')}, other@${esc((CURCASE && CURCASE.mailDomain) || 'school.edu.tw')}">${esc((g.emails||[]).join(', '))}</textarea>
    <button type="button" class="danger" onclick="this.parentNode.remove()" aria-label="刪除這個群組">刪除</button></div>`;
}
function gmAdd(){
  const rows = document.getElementById('gm_rows');
  rows.insertAdjacentHTML('beforeend', gmRow({}));
  rows.lastElementChild.querySelector('.gm-name').focus();
}
function gmClose(){ const box = document.getElementById('gm'); box.hidden = true; box.innerHTML = ''; }
function gmSave(){
  const list = Array.from(document.querySelectorAll('#gm_rows .row')).map(r => ({
    id: r.dataset.id || '',
    name: r.querySelector('.gm-name').value.trim(),
    emails: r.querySelector('.gm-emails').value
  })).filter(g => g.name || g.emails.trim());
  const b = document.getElementById('gm_save');
  b.disabled = true;
  google.script.run.withSuccessHandler(r => {
    const keep = Array.from(document.querySelectorAll('#m_groups input:checked')).map(x => x.value);
    CURCASE.groups = r.groups;
    CURCASE.scopeGroups = r.scopeGroups;
    document.getElementById('m_groups').innerHTML = groupBoxes(r.groups, keep);
    countRecipients();
    gmClose();
    toast('已儲存收件群組（' + r.groups.length + ' 個）');
  }).withFailureHandler(e => { b.disabled = false; toast(e.message, 8000); }).api_saveGroups(list);
}

function busy(on, label){
  const b = document.getElementById('btnOk');
  if(b){ b.disabled = on; b.innerHTML = on ? '<span class="spin"></span>'+label : esc(modeLabel(curMode())); }
}

function save(){
  google.script.run.withSuccessHandler(r=>{ toast('已存草稿（'+r.risk.level+'燈）'); open_(CUR); })
    .withFailureHandler(e=>toast(e.message)).api_save(CUR, payload());
}

function approve(){
  const chk = document.getElementById('f_checked');
  if(chk && !chk.checked){
    toast('有附件沒辦法自動掃描或疑似名冊，請先逐一打開檢查，再勾選「我已打開檢查附件」。', 6000);
    chk.focus();
    return;
  }
  const p = payload();
  const c = CURCASE || {};
  const mailLine = '\n寄件標題：' + document.getElementById('m_preview').textContent
    + '\n收件群組：' + (groupNames(p) || '（沒有勾）') + '\n附件：' + (c.mailFiles||[]).length + ' 個';
  const msg = p.mode==='只有寄信'
    ? '確定核准寄信？約 5 分鐘內會用 ' + c.mailSender + ' 寄出，寄出後無法收回。\n' + mailLine
    : p.mode==='公告＋寄信'
    ? '確定核准？公告助手會自動發布到校網；上架後再用 ' + c.mailSender + ' 寄信（信裡附公告網址）。\n' + mailLine
    : '確定核准？核准後公告助手會自動發布到校網（後台分頁需開著並勾選「核准後自動發布」）。';
  const npLine = c.notPublic && p.mode !== '只有寄信' && p.notPublicOk
    ? '\n\n⚠ AI 研判這則不宜公開到校網，你已勾選確認可以公開。' : '';
  if(!confirm(msg + npLine)) return;
  busy(true,'處理中');
  google.script.run.withSuccessHandler(r=>{
    busy(false);
    toast(r.message, 6000);
    if(r.ok){ load(); document.getElementById('pane').innerHTML='<div class="empty">'+esc(r.message)+'</div>'; CUR=null; }
  }).withFailureHandler(e=>{busy(false); toast(e.message,6000);})
    .api_approve(CUR, Object.assign(p, { filesChecked: !!(chk && chk.checked) }));
}

/** 改歸檔資料夾（立即存） */
function setArchive(v){
  google.script.run.withSuccessHandler(r=>{ toast('已歸到「'+r.archive+'」'); load(); })
    .withFailureHandler(e=>toast(e.message,6000)).api_setArchive(CUR, v);
}

/** 刪除整份公文：資料夾移到雲端硬碟垃圾桶（30 天內可救回），審核台不再顯示 */
function del(){
  const c = CURCASE || {};
  let m = '確定刪除「'+(c.title||'')+'」？\n\n公文資料夾和裡面所有檔案會移到 Google 雲端硬碟的垃圾桶（30 天內可以從垃圾桶救回），審核台不再顯示這則。';
  if(c.status==='PUBLISHED') m += '\n\n注意：校網上已發布的公告不會被刪除，要到校網後台自己刪。';
  if(!confirm(m)) return;
  google.script.run.withSuccessHandler(r=>{
    toast(r.trashed ? '已刪除，資料夾已移到垃圾桶' : '已從審核台刪除（資料夾已不在）', 5000);
    CUR = null; document.getElementById('pane').innerHTML = '<div class="empty">已刪除</div>'; load();
  }).withFailureHandler(e=>toast(e.message,6000)).api_deleteCase(CUR);
}

/** 已退回 → 重新送審 */
function resubmit(){
  if(!confirm('把這則改回待審，重新審核後再送出？')) return;
  google.script.run.withSuccessHandler(c=>{ detail(c); toast('已改回待審'); load(); })
    .withFailureHandler(e=>toast(e.message,6000)).api_resubmit(CUR);
}

/** 紅燈強制送出：看過風險、寫下原因；密等公文還要輸入「確認公開」 */
function force(){
  const c = CURCASE || {};
  const chk = document.getElementById('f_checked');
  if(c.forceFileCheck && !(chk && chk.checked)){
    toast('強制送出前，請先逐一打開附件和公文本體檢查，再勾選「我已打開檢查附件」。', 6000);
    if(chk) chk.focus();
    return;
  }
  const fm = curMode();
  const what = fm==='只有寄信' ? '會用 ' + c.mailSender + ' 把信和檔案（含公文本體）寄給：' + groupNames(payload())
    : fm==='公告＋寄信' ? '公告助手會照常把公告和檔案（含公文本體）發到校網，上架後再寄信給：' + groupNames(payload())
    : '公告助手會照常把公告和檔案（含公文本體）發到校網';
  if(!confirm('這則是紅燈：\n\n・' + (c.riskNotes||[]).join('\n・') +
     '\n\n強制送出後，' + what + '。\n確定已經看過、可以送出嗎？')) return;
  const why = prompt('請寫下可以公開的原因（會記錄在系統裡）：');
  if(why===null) return;
  let typed = '';
  if(c.secret){
    typed = prompt('這份公文標示密等「'+c.security+'」。確定要公開，請輸入「確認公開」：');
    if(typed===null) return;
  }
  google.script.run.withSuccessHandler(r=>{
    toast(r.message, 6000);
    if(r.ok){ load(); document.getElementById('pane').innerHTML='<div class="empty">'+esc(r.message)+'</div>'; CUR=null; }
  }).withFailureHandler(e=>toast(e.message,6000))
    .api_forceApprove(CUR, Object.assign(payload(), { filesChecked: !!(chk && chk.checked) }), why, typed);
}

/** 只因附件掃描被擋下：打開附件確認後，寫原因解除紅燈（之後核准仍要勾「已開啟檢查」） */
function overrideRed(){
  const why = prompt('請寫下可以公開的原因（例如：附件裡是範例資料、空白報名表）：');
  if(why===null) return;
  google.script.run.withSuccessHandler(c=>{ detail(c); toast('已解除紅燈，回到待審'); load(); })
    .withFailureHandler(e=>toast(e.message,6000)).api_overrideFileRed(CUR, why);
}

/** 送出中：到校網確認已上架，貼公告網址標成已發布 */
function markPublished(){
  // Apps Script 送出網頁時會刪掉它認為是註解的「//」到行尾，字串裡的網址斜線要寫成 \/\/
  const url = prompt('貼上校網上這則公告的網址（.../p/....php）：');
  if(url===null) return;
  google.script.run.withSuccessHandler(()=>{ toast('已標成已發布'); load(); open_(CUR); })
    .withFailureHandler(e=>toast(e.message,6000)).api_markPublished(CUR, url.trim());
}

/** 送出中：到後台確認沒有這則，改回待發布（自動發布開著會重新送出） */
function unsubmit(){
  if(!confirm('請先到校網後台「公告模組」確認真的沒有這則公告。\n\n改回待發布後，自動發布開著的話會重新送出一次；不想發了，改回後再按「退回」。\n\n確定後台沒有這則嗎？')) return;
  google.script.run.withSuccessHandler(()=>{ toast('已改回待發布'); load(); open_(CUR); })
    .withFailureHandler(e=>toast(e.message,6000)).api_unsubmit(CUR);
}

/** 寄信失敗：排除原因（可以先改寄信內容、收件群組）後重新寄送；上一封可能已寄出的話，先到寄件備份確認 */
function retryMail(){
  const c = CURCASE || {};
  const p = payload();
  const maybe = /可能已經寄出/.test(c.mailResult||'');
  const m = (maybe
    ? '上一封可能已經寄出。請先到 ' + c.mailSender + ' 的「寄件備份」確認真的沒有寄出，再按確定重新寄送。\n'
    : '重新寄送這封信？（上次失敗原因：' + (c.mailResult||'未說明') + '）\n')
    + '\n寄件標題：' + document.getElementById('m_preview').textContent + '\n收件群組：' + (groupNames(p) || '（沒有勾）');
  if(!confirm(m)) return;
  const b = document.getElementById('btnRetryMail');
  if(b){ b.disabled = true; b.innerHTML = '<span class="spin"></span>處理中'; }
  google.script.run.withSuccessHandler(r=>{ toast(r.message,6000); load(); open_(CUR); })
    .withFailureHandler(e=>{ if(b){ b.disabled = false; b.textContent = '重新寄送'; } toast(e.message,6000); })
    .api_retryMail(CUR, p);
}

/** 取消寄送／不寄了：還沒寄出的信不寄（只有寄信的案件會改成已退回） */
function cancelMail(){
  const c = CURCASE || {};
  const m = c.mailState==='失敗' ? '這封信不寄了？' + (c.status==='MAILING' ? '\n這則只有寄信，取消後會改成「已退回」。' : '')
    : '取消寄送這封信？' + (c.mailState==='待寄' ? '\n寄信小幫手如果已經開始寄，就沒辦法取消。' : '\n校網公告照常發布，只是不寄信。');
  if(!confirm(m)) return;
  google.script.run.withSuccessHandler(r=>{ toast(r.message,6000); load(); open_(CUR); })
    .withFailureHandler(e=>toast(e.message,6000)).api_cancelMail(CUR);
}

function retry(){
  google.script.run.withSuccessHandler(r=>{ toast(r.message,6000); load(); })
    .withFailureHandler(e=>toast(e.message,6000)).api_retryPublish(CUR);
}

function reject(){
  const n = prompt('退回原因：');
  if(n===null) return;
  google.script.run.withSuccessHandler(()=>{ toast('已退回'); load();
    document.getElementById('pane').innerHTML='<div class="empty">已退回</div>'; CUR=null; })
    .withFailureHandler(e=>toast(e.message)).api_reject(CUR, n);
}

/** 存過草稿或畫面上有沒存的修改 → 回傳提醒文字；都沒有回傳空字串 */
function reparseWarning(){
  if(!DRAFT) return '';
  const dirty = JSON.stringify(payload()) !== DRAFT.orig;
  if(!DRAFT.savedAt && !dirty) return '';
  const why = DRAFT.savedAt
    ? '這則在 ' + DRAFT.savedAt + ' 存過草稿' + (dirty ? '，畫面上還有沒存的修改' : '')
    : '畫面上有還沒存的修改';
  return why + '。\n\n重新解析會讓 AI 重寫標題、內文、分類、適用對象與起迄日，你改過的內容會被蓋掉。\n\n確定要重新解析嗎？';
}

function reparse(){
  const w = reparseWarning();
  if(w && !confirm(w)) return;
  toast('重新解析中，約需 10 秒…');
  google.script.run.withSuccessHandler(c=>{ detail(c); toast('已重新解析'); load(); })
    .withFailureHandler(e=>toast(e.message)).api_reparse(CUR);
}

load();
</script>
